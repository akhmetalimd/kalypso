{% extends "base.html" %}
{% from "_macros.html" import csrf_field with context %}
{% block title %}Смена пароля{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Смена пароля</h1>
  {% if p.must_change_password %}<p class="muted">Перед началом работы задайте собственный пароль.</p>{% endif %}
  <form method="post" action="/password" class="stack">
    {{ csrf_field() }}
    <label>Текущий пароль <input type="password" name="old" autocomplete="current-password" required></label>
    <label>Новый пароль (не короче 10 символов) <input type="password" name="new" autocomplete="new-password" minlength="10" required></label>
    <label>Новый пароль ещё раз <input type="password" name="new2" autocomplete="new-password" minlength="10" required></label>
    <button class="primary">Сменить пароль</button>
  </form>
</section>
{% endblock %}
