[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalypso"
version = "0.1.0"
description = "KALYPSO — пробная платформа регистра ЛПЗ"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.144.0",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "argon2-cffi==25.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "pgserver==0.1.4",
]

[tool.setuptools]
py-modules = ["registry_core"]

[tool.setuptools.packages.find]
include = ["kalypso*"]

[tool.setuptools.package-data]
kalypso = ["locales/*.json", "web/templates/*.html", "web/static/*", "dev_seed.json"]
