# nginx перед приложением: только HTTPS, приложение — в сети frontend по адресу app:8000.
# Сертификат — /etc/nginx/certs/kalypso.crt и .key (каталог deploy/certs, см. docs/deploy.md).

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/kalypso.crt;
    ssl_certificate_key /etc/nginx/certs/kalypso.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Формы небольшие; файлов платформа не принимает.
    client_max_body_size 1m;

    # Проверка живости — только для Docker изнутри, снаружи не нужна.
    location = /healthz { return 404; }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        # Адрес клиента задаём сами (не дописываем к присланному) — подделать нельзя.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
